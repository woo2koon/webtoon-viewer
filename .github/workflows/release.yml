name: "Release Build"

on:
  push:
    tags:
      - 'v*' # v1.0.0 처럼 태그를 붙여서 올릴 때만 빌드가 시작됩니다.

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest] # 맥과 윈도우 둘 다 빌드!

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # package.json의 버전을 자동으로 사용합니다.
          releaseName: "Webtoon Viewer v__VERSION__"
          releaseBody: "자동 빌드된 배포판입니다."
          releaseDraft: true
          prerelease: false