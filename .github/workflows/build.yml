name: Build and Package

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --noconsole --onefile --add-data "viewer.html;." --add-data "viewer.js;." --add-data "jszip.min.js;." --add-data "html2canvas.min.js;." --name "WebtoonViewerPro_Win" main.py

    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --noconsole --onefile --add-data "viewer.html:." --add-data "viewer.js:." --add-data "jszip.min.js:." --add-data "html2canvas.min.js:." --name "WebtoonViewerPro_Mac" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WebtoonViewerPro-${{ matrix.os }}
        path: |
          dist/WebtoonViewerPro_Win.exe
          dist/WebtoonViewerPro_Mac
